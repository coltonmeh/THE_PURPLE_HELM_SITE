<style>
/* Layout idea: one phone-width column of plain cards under a sticky tab bar; belt gold marks only what a reader should act on. */
:root {
  --paper: #110a1b;
  --card: #1b1328;
  --ink: #efe7dc;
  --muted: #ad9fbe;
  --line: #372a4d;
  --helm: #b58cff;
  --helm-soft: #2b1f42;
  --belt: #d9aa4a;
  --belt-soft: #3b2d12;
  --belt-fill: #d9aa4a;  --on-belt: #1a1029;
  --top-a: #24143a;  --top-b: #0d0716;  --top-title: #d9aa4a;  --top-sub: #ad9fbe;
  --hero-bg: #0d0716;  --hero-title: #f3d590;  --hero-shadow: 0 2px 10px #000;
  --hero-veil: linear-gradient(90deg, rgba(13, 7, 22, .88) 0%, rgba(13, 7, 22, .45) 42%, rgba(13, 7, 22, 0) 68%);
  --s-league: #9272dd;
  --s-this: #b58b25;
  --good: #5cc691;  --good-soft: #153324;
  --warn: #eaa545;  --warn-soft: #3a2a12;
  --bad: #ff8478;   --bad-soft: #401c19;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --saga: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
/* Light mode: frost and snow from the light banners, with the same purple and gold. The header keeps its purple band. */
:root[data-theme="light"] {
  --paper: #f3eff8;
  --card: #ffffff;
  --ink: #23153a;
  --muted: #645775;
  --line: #dbd1e9;
  --helm: #6a3bc0;
  --helm-soft: #ede5fa;
  --belt: #855d00;
  --belt-soft: #f6e9cc;
  --belt-fill: #e0b455;  --on-belt: #1a1029;
  --top-a: #47268a;  --top-b: #2c1558;  --top-title: #f1cf7c;  --top-sub: #d5c8ea;
  --hero-bg: #f3eff8;  --hero-title: #3a1c6e;  --hero-shadow: 0 1px 0 #fff, 0 0 14px rgba(255, 255, 255, .95);
  --hero-veil: linear-gradient(90deg, rgba(250, 247, 253, .92) 0%, rgba(250, 247, 253, .6) 40%, rgba(250, 247, 253, 0) 66%);
  --s-league: #7a5ad0;
  --s-this: #b3861c;
  --good: #17764a;  --good-soft: #def3e7;
  --warn: #8a5200;  --warn-soft: #fbecd2;
  --bad: #b3302a;   --bad-soft: #fbe2df;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.45 var(--body); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.55rem; line-height: 1.1; }
h3 { font-size: 1.2rem; line-height: 1.15; }
p { margin: 0; }
a { color: var(--helm); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--belt); outline-offset: 2px; }

.top { background: linear-gradient(180deg, var(--top-a) 0%, var(--top-b) 100%); color: var(--ink); border-bottom: 3px solid var(--belt-fill); }
.top-in { max-width: 980px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
.top .logo { height: 64px; width: auto; flex: none; display: block; }
.top h1 { font-family: var(--saga); font-weight: 900; font-size: 1.55rem; letter-spacing: .05em; line-height: 1.05; color: var(--top-title); text-transform: uppercase; }
.top .asof { display: block; font-size: .82rem; color: var(--top-sub); margin-top: 2px; }
.top-in > div { flex: 1; min-width: 0; }
.theme-btn { flex: none; width: 40px; height: 40px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .08); color: var(--top-title); cursor: pointer; display: grid; place-items: center; padding: 0; }
.theme-btn:hover { background: rgba(255, 255, 255, .16); }
.theme-btn svg { width: 20px; height: 20px; }
.theme-btn .sun { display: none; }
:root[data-theme="light"] .theme-btn .sun { display: block; }
:root[data-theme="light"] .theme-btn .moon { display: none; }
.hero { position: relative; aspect-ratio: 3 / 1; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--hero-bg) right center / cover no-repeat; display: flex; align-items: flex-end; }
.hero::before { content: ''; position: absolute; inset: 0; background: var(--hero-veil); }
.hero h2 { position: relative; font-family: var(--saga); font-weight: 900; color: var(--hero-title); font-size: clamp(1.35rem, 4.4vw, 2.7rem); line-height: 1.05; letter-spacing: .03em; padding: 14px 18px; max-width: 58%; text-shadow: var(--hero-shadow); }
.hero[hidden] { display: none; }
.view.has-hero > div:first-child > h2 { display: none; }
@media (max-width: 600px) { .hero { aspect-ratio: 2.3 / 1; } .hero h2 { max-width: 64%; padding: 10px 12px; } .top .logo { height: 52px; } .top h1 { font-size: 1.25rem; } }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 980px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 6px; overflow-x: auto; }
.tab { flex: 1 0 auto; text-align: center; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 9px; font-size: .9rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--belt-fill); border-color: var(--belt-fill); color: var(--on-belt); }
.top h1 a { color: inherit; text-decoration: none; }
.navsel { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 600px) {
  .tabs-in .tab { display: none; }
  .navsel { display: block; flex: 1; }
  .navsel select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 600; }
}
main { max-width: 980px; margin: 0 auto; padding: 18px 16px 48px; display: grid; gap: 16px; }
.view { display: none; gap: 16px; }
.view.on { display: grid; }
.lede { color: var(--muted); max-width: 65ch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.note { font-size: .9rem; color: var(--muted); }
.stale { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-weight: 500; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: right; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
th { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; vertical-align: bottom; }
tr:last-child td { border-bottom: 0; }
.tn { font-weight: 600; }
.sub { display: block; font-size: .82rem; color: var(--muted); font-weight: 400; }
.nums { display: flex; flex-wrap: wrap; gap: 0 14px; margin-top: 2px; }
.nums span { white-space: nowrap; }
.nums b { color: var(--ink); font-weight: 600; }
.nums a { color: inherit; text-decoration: underline; text-decoration-color: var(--helm); text-underline-offset: 3px; padding: 4px 6px; margin: -4px -6px; }
.nums a b { color: var(--helm); }
.stand { display: grid; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 88px); gap: 4px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow.cut { border-bottom: 2px solid var(--helm); }
.shead { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 0; }
.shead span:not(:first-child), .stat { text-align: right; }
.stat b { font-weight: 600; }
.stat .lab { display: none; font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
@media (max-width: 600px) {
  .shead { display: none; }
  .srow { grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start; }
  .steam { grid-column: 1 / -1; }
  .stat { text-align: left; }
  .stat .lab { display: block; }
}
.bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 3px; }
.srow2 { border-bottom: 1px solid var(--line); }
.srow2.end { border-bottom: 0; }
.srow2 > summary, .shead2 { display: grid; grid-template-columns: minmax(0, 1fr) repeat(5, 82px); gap: 4px 12px; align-items: center; }
.srow2 > summary { list-style: none; padding: 10px 0; color: inherit; font-size: inherit; font-weight: 400; cursor: pointer; }
.srow2 > summary::-webkit-details-marker { display: none; }
.srow2[open] > summary { margin-bottom: 0; }
.srow2 .caret { color: var(--helm); margin-left: 8px; font-size: .8em; }
.srow2 .caret::before { content: '\25B8'; }
.srow2[open] .caret::before { content: '\25BE'; }
.shead2 { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.shead2 span:not(:first-child) { text-align: right; }
.stat.rec b { font-size: 1.15rem; }
.smore { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 16px; padding: 2px 0 14px; }
.smore span { display: block; font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.smore .nums span { display: inline; font-size: 1rem; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ink); }
.smore b { font-weight: 600; }
.cutlab { font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--helm); border-top: 2px solid var(--helm); margin-top: -1px; padding: 2px 0 0; text-align: right; }
@media (max-width: 600px) {
  .shead2 { display: none; }
  .srow2 > summary { grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; gap: 4px 8px; }
  .srow2 .steam { grid-column: 1 / -1; }
  .srow2 .stat .lab { display: flex; align-items: flex-end; min-height: 2.3em; line-height: 1.1; }
}
:root { --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c-rest: #473d5e; --grid: #2c2340; }
:root[data-theme="light"] { --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --c-rest: #cfc6dc; --grid: #e7e0f0; }
.two { display: grid; gap: 16px; align-items: start; }
@media (min-width: 860px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.viz { position: relative; }
.viz svg { display: block; width: 100%; height: auto; touch-action: pan-y; outline-offset: 2px; }
.viz svg:focus:not(:focus-visible) { outline: none; }
.viz text { font-family: var(--body); font-size: 11px; fill: var(--muted); }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: .82rem; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); min-width: 150px; max-width: 220px; z-index: 2; }
.tip .th { font-weight: 600; margin-bottom: 2px; }
.tip .tr { display: flex; justify-content: space-between; gap: 10px; }
.tip .tr span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; flex: none; }
.key { background: currentColor; }
.key.dash { background: linear-gradient(90deg, currentColor 0 5px, transparent 5px 9px, currentColor 9px 14px); }
.lg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 16px; font-size: .84rem; }
.lg .lgh { grid-column: 1 / -1; font-weight: 600; }
.lg > span { display: flex; align-items: center; min-width: 0; color: var(--muted); }
.lg .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.lg b { color: var(--ink); font-weight: 600; margin-left: 6px; }
.lg .hl .nm { color: var(--ink); font-weight: 600; }
.mgame { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 52px 52px; gap: 2px 12px; padding: 3px 0; align-items: baseline; }
.mrow.two { grid-template-columns: minmax(0, 1fr) auto; }
.mrow.mhead { padding: 0 11px; }
.mrow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .w { font-weight: 600; }
.mrow .num { text-align: right; min-width: 52px; }
.mhead { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding-top: 0; }
.bracket { display: grid; gap: 8px; }
.bgame { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.bgame .seed { color: var(--muted); display: inline-block; min-width: 2.2em; }
.rulebook ol { margin: 0; padding-left: 22px; display: grid; gap: 7px; }
.rulebook ol ol { list-style: lower-alpha; margin-top: 6px; }
.rulebook ol ol ol { list-style: lower-roman; }
.rulebook ol ol ol ol { list-style: decimal; }
.rulebook details { border-top: 1px solid var(--line); padding-top: 8px; }
.rulebook details > * + * { margin-top: 8px; }
.board td, .board th { padding: 5px 6px; font-size: .82rem; text-align: center; }
.board td.mv { background: var(--belt-soft); color: var(--ink); font-weight: 600; }
.race { display: grid; }
.race-team { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.race-team:first-child { padding-top: 0; }
.race-team:last-child { border-bottom: 0; padding-bottom: 0; }
.rt-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; }
.race-team .pill { margin-right: 4px; }
details summary { cursor: pointer; color: var(--helm); font-weight: 600; font-size: .9rem; }
details[open] summary { margin-bottom: 6px; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--helm); }
.bar.lake i { background: var(--bad); }

.sides { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.side label, .field { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: grid; gap: 4px; }
.field { max-width: 420px; }
.side select, .field select { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-weight: 600; font-size: 1rem; text-transform: none; letter-spacing: 0; }
.field select { background: var(--card); }
.gives { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 32px; }
.gives .lbl { font-weight: 600; }
.chip { background: var(--helm-soft); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: .9rem; font-weight: 500; }
.group { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.asset { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; cursor: pointer; text-align: left; }
.asset[aria-pressed="true"] { background: var(--helm); border-color: var(--helm); color: var(--paper); }
.asset[aria-pressed="true"] .sub, .asset[aria-pressed="true"] .tag { color: inherit; opacity: .85; }
.asset.pick { padding: 6px 10px; font-weight: 600; }
.asset.pick .sub { display: inline; margin-left: 4px; }
.players { display: grid; gap: 6px; max-height: 330px; overflow-y: auto; padding-right: 2px; }
.asset.player { padding: 7px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; width: 100%; }
.asset.player .nm { font-weight: 600; }
.asset.player .val { font-weight: 600; }
.asset.player .sub { grid-column: 1 / -1; }
.tag { font-size: .78rem; color: var(--muted); }

.verdict { border-left: 6px solid var(--line); }
.verdict.even { border-left-color: var(--good); }
.verdict.lean { border-left-color: var(--warn); }
.verdict.lop { border-left-color: var(--bad); }
.band { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; padding: 2px 10px; border-radius: 6px; }
.even .band { background: var(--good-soft); color: var(--good); }
.lean .band { background: var(--warn-soft); color: var(--warn); }
.lop .band { background: var(--bad-soft); color: var(--bad); }
.outcome { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.team-out { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.metric { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; align-items: baseline; }
.metric .k { font-weight: 600; }
.metric .v { font-family: var(--display); font-weight: 700; font-size: 1.7rem; line-height: 1; }
.metric .sub { grid-column: 1 / -1; }
.metric .v small { font-family: var(--body); font-size: .8rem; font-weight: 600; margin-left: 4px; }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
.base { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.k-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--s-league); display: inline-block; }
.k-dot.me { background: var(--s-this); }
.k-dot.proj { background: var(--card); box-shadow: inset 0 0 0 2.5px var(--s-this); }
.k-band { width: 18px; height: 10px; border-radius: 2px; background: var(--helm-soft); display: inline-block; }
.strip { display: grid; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) 2.4em; gap: 2px 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.strip .brow:last-child { border-bottom: 0; }
.blab { grid-column: 1 / -1; }
.btrack { position: relative; height: 18px; }
.btrack::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; border-radius: 1px; background: var(--line); }
.bband { position: absolute; top: 2px; height: 14px; border-radius: 3px; background: var(--helm-soft); }
.beven { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed var(--muted); }
.bdot { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--s-league); box-shadow: 0 0 0 2px var(--card); }
.brow.me .bdot, .brow.proj .bdot { top: 3px; width: 12px; height: 12px; margin-left: -6px; background: var(--s-this); }
.brow.proj .bdot { background: var(--card); box-shadow: inset 0 0 0 2.5px var(--s-this), 0 0 0 2px var(--card); }
.brow.me, .brow.proj { background: var(--belt-soft); margin: 0 -6px; padding-left: 6px; padding-right: 6px; border-radius: 6px; border-bottom-color: transparent; }
.brow.me .btrack::before, .brow.proj .btrack::before { background: var(--muted); opacity: .35; }
.bval { text-align: right; font-weight: 600; }
.baxis { position: relative; height: 1.4em; margin-right: calc(2.4em + 8px); font-size: .75rem; color: var(--muted); }
.baxis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.baxis span:first-child { transform: none; }
@media (min-width: 640px) {
  .brow { grid-template-columns: 250px minmax(0, 1fr) 2.6em; }
  .blab { grid-column: auto; }
  .baxis { margin-left: 258px; margin-right: calc(2.6em + 8px); }
}
.band.both { background: var(--good-soft); color: var(--good); }
.band.favors { background: var(--warn-soft); color: var(--warn); }
.band.bad { background: var(--bad-soft); color: var(--bad); }
.band.close, .band.open { background: var(--helm-soft); color: var(--ink); }
.verdict.both { border-left-color: var(--good); } .verdict.favors { border-left-color: var(--warn); } .verdict.bad { border-left-color: var(--bad); }
.tagw { font-size: .78rem; font-weight: 600; }

<script>
(function () {
  const D = DATA, E = makeEngine(D), P = D.players;
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = x => x >= 0.995 ? '99%+' : x <= 0 ? '0%' : x < 0.005 ? 'under 1%' : Math.round(x * 100) + '%';
  const sgn = x => (x > 0.049 ? '+' : x < -0.049 ? '−' : '') + Math.abs(x).toFixed(1);
  const cls = x => x > 0.049 ? 'up' : x < -0.049 ? 'down' : 'flat';
  const ord = E.ord;
  const teams = D.teams.slice().sort((a, b) => (b.w + b.t / 2) - (a.w + a.t / 2) || b.pf - a.pf);
  const T = {}; D.teams.forEach(t => { T[t.rid] = t; });
  const rec = t => `${t.w}-${t.l}${t.t ? '-' + t.t : ''}`;
  const wkRange = `Weeks ${D.weeks[0]}–${D.weeks[D.weeks.length - 1]}`;
  const store = { get(k) { try { return JSON.parse(localStorage.getItem('ph-' + k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('ph-' + k, JSON.stringify(v)); } catch (e) {} } };

  // ---------- header
  const asof = new Date(D.asof);
  $('#asof').textContent = 'Data from ' + asof.toLocaleString('en-US', { timeZone: 'America/Chicago', weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' CT';
  const ageDays = (Date.now() - asof.getTime()) / 864e5;
  if (ageDays > 3) $('#stale').innerHTML = `<p class="stale">This data is ${Math.floor(ageDays)} days old. Rosters, picks and projections may have changed since.</p>`;

  // ---------- home: the week at a glance
  const HI = D.hist || null;
  let hlTeam = (function () { const v = store.get('highlight'); return v && T[v] ? v : null; })();
  const afterWk = k => k === 0 ? 'Before Week 1' : 'After Week ' + k;
  // Every team gets a line. Eight hues in standings order; the last four reuse the first four hues, dashed.
  const SLOT = {}; teams.forEach((t, i) => { SLOT[t.rid] = { c: `var(--c${i % 8 + 1})`, dash: i >= 8 }; });
  const keyHTML = rid => `<i class="key${SLOT[rid].dash ? ' dash' : ''}" style="color:${SLOT[rid].c}"></i>`;
  function drawChart(key) {
    const box = $('#chart-' + key); if (!box || !HI) return;
    const wd = Math.max(280, Math.min(box.clientWidth || 340, 900)), ht = Math.round(Math.min(300, Math.max(200, wd * 0.52)));
    const m = { l: 36, r: 12, t: 10, b: 34 }, n = HI.weeks.length;
    const x = i => m.l + (wd - m.l - m.r) * i / (n - 1), y = v => m.t + (ht - m.t - m.b) * (1 - v);
    const pathOf = rid => HI[key][rid].map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
    const drawn = teams.slice().sort((a, b) => (a.rid === hlTeam) - (b.rid === hlTeam));    // the highlighted team on top
    const grid = [0, 0.25, 0.5, 0.75, 1].map(v => `<line x1="${m.l}" x2="${wd - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`).join('');
    const every = wd < 340 ? 2 : 1;
    const xl = HI.weeks.map((k, i) => (n - 1 - i) % every && i !== 0 ? '' : `<text x="${x(i)}" y="${ht - m.b + 16}" text-anchor="middle">${k === 0 ? 'Start' : k}</text>`).join('');
    const dim = t => hlTeam && t.rid !== hlTeam;
    const lines = drawn.map(t => `<path d="${pathOf(t.rid)}" fill="none" stroke="${SLOT[t.rid].c}" stroke-width="${t.rid === hlTeam ? 3.5 : 2}"${SLOT[t.rid].dash ? ' stroke-dasharray="5 4"' : ''}${dim(t) ? ' opacity="0.3"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`).join('');
    const what = key === 'po' ? 'the playoffs' : 'the Toilet Bowl';
    box.innerHTML = `<svg viewBox="0 0 ${wd} ${ht}" role="img" tabindex="0" aria-label="Each team's chance of ${what} after each week. Use the left and right arrow keys to read a week; the same numbers are in the table below.">
      ${grid}${xl}<text x="${(m.l + wd - m.r) / 2}" y="${ht - 4}" text-anchor="middle">After week</text>
      <line class="hair" x1="0" x2="0" y1="${m.t}" y2="${ht - m.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
      ${lines}<g class="marks"></g></svg>`;
    const svg = $('svg', box), hair = $('.hair', box), marks = $('.marks', box), lg = $('#legend-' + key);
    // The list under the chart is both the legend and the readout: every team, at the week being pointed at.
    let at = null;
    const readout = i => {
      const cols = [...teams];
      lg.innerHTML = `<div class="lgh">${i === n - 1 ? 'Today' : afterWk(HI.weeks[i])}${i === n - 1 ? '' : ' <span class="note">(rebuilt)</span>'}</div>`
        + cols.map(t => `<span class="${t.rid === hlTeam ? 'hl' : ''}">${keyHTML(t.rid)}<span class="nm">${esc(t.team)}</span><b>${(v => v > 0 && v < 0.005 ? '<1%' : pct(v))(HI[key][t.rid][i])}</b></span>`).join('');
      marks.innerHTML = teams.map(t => `<circle cx="${x(i)}" cy="${y(HI[key][t.rid][i])}" r="${t.rid === hlTeam ? 5 : 4}" fill="${SLOT[t.rid].c}" stroke="var(--card)" stroke-width="2"${dim(t) ? ' opacity="0.3"' : ''}/>`).join('');
    };
    const showAt = i => { at = Math.max(0, Math.min(n - 1, i)); hair.setAttribute('x1', x(at)); hair.setAttribute('x2', x(at)); hair.setAttribute('visibility', 'visible'); readout(at); };
    const reset = () => { at = null; hair.setAttribute('visibility', 'hidden'); readout(n - 1); };
    const fromEvent = e => { const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * wd / r.width; showAt(Math.round((px - m.l) / (wd - m.l - m.r) * (n - 1))); };
    svg.addEventListener('pointermove', fromEvent); svg.addEventListener('pointerdown', fromEvent);
    svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') reset(); });        // a tap stays on its week
    svg.addEventListener('blur', reset);
    svg.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); showAt((at == null ? n - 1 : at) + (e.key === 'ArrowLeft' ? -1 : 1)); }
      else if (e.key === 'Escape') reset();
    });
    reset();
  }
  const drawCharts = () => { drawChart('po'); drawChart('b4'); };
  function histTable(key) {
    const head = HI.weeks.map(k => `<th>${k === 0 ? 'Start' : 'Wk ' + k}</th>`).join('');
    const rows = teams.map(t => `<tr><td>${esc(t.team)}</td>${HI[key][t.rid].map(v => `<td>${v >= 0.995 ? '99+' : Math.round(v * 100)}</td>`).join('')}</tr>`).join('');

    const nextHTML = wk.length ? `<div class="card"><div><h3>Week ${cur} matchups</h3><p class="note">Projected points for each team's best lineup, and its chance to win.</p></div>
      <div class="mrow mhead"><span>Team</span><span class="num">Proj.</span><span class="num">Win</span></div>

    const charts = HI ? `

        <div class="card"><div><h3>Toilet Bowl chances, week by week <span class="pill est">Rebuilt</span></h3></div><div class="viz" id="chart-b4"></div><div class="lg" id="legend-b4"></div>${histTable('b4')}</div>
      </div>

    $('#view-home').innerHTML = `
      <div><h2>Week ${cur}</h2><p class="lede">${D.week_live ? `Week ${D.week_live} is being played. ` : ''}Records count Weeks 1–${D.last_done}. ${SC ? `${SC.left} game${SC.left === 1 ? '' : 's'} left before the brackets are set after Week ${D.reg_end}.` : ''}</p></div>

  $('#view-home').addEventListener('change', e => {

  // ---------- standings
  function gamesFor(rid) {
    return (D.games || []).filter(g => g.a === rid || g.b === rid).map(g => {
      const me = g.a === rid;
      return { w: g.w, opp: me ? g.b : g.a, pw: me ? g.pa : 1 - g.pa, po: me ? g.a_po : g.b_po, b4: me ? g.a_b4 : g.b_b4 };

  // One race (top four, or bottom four): each team still in it, its biggest remaining game, and the rest on tap.
  function raceHTML(title, blurb, key, word, odds) {
    const list = teams.filter(t => odds(t) >= 0.02 && odds(t) <= 0.98).sort((x, y) => odds(y) - odds(x));

    }).join('');

  }
  function renderStandings() {

  // ---------- playoff scenarios: each team's most likely path, and a pick-the-winners simulator
  const SC = D.scen || null, SG = SC ? E.scenGames() : [];
  const inRace = x => x >= 0.02 && x <= 0.98;                 // the same teams the standings tab lists as still in a race
  const pctS = x => x >= 0.995 ? '99%+' : x < 0.005 ? 'under 1%' : Math.round(x * 100) + '%';
  let scenView = store.get('scen-view') === 'sim' ? 'sim' : 'paths';
  let scenTeam = (function () { const v = store.get('scen-team'); return v && T[v] ? v : hlTeam || 'race'; })();
  let picks = (function () { const v = store.get('picks'); return v && v.asof === D.asof && v.picks ? v.picks : {}; })();
  let simWeek = null, quickTeam = null;
  function pathCard(t, open) {

    const fin = k => nb(`${t.w + k}–${t.l + L - k}${t.t ? '–' + t.t : ''}`);
    const route = k => `${k === L ? `Win all ${L}` : k === 0 ? `Lose all ${L}` : `Go ${nb(`${k}–${L - k}`)}`}, finish ${fin(k)}`;

    const other = x => { const o = T[x.with.rid]; return `${esc(o.team)}, most often when they finish ${nb(`${o.w + x.with.k}–${o.l + L - x.with.k}${o.t ? '–' + o.t : ''}`)}`; };

    // One race: the most common way in and, for a team already projected in, the most common way out of it.

      const rows = [];

      { in: 'Likely route in', chance: 'Lands there', inWith: 'Passed by', out: 'Likely way out', outChance: 'Gets out', outWith: 'Passes' })));

    const few = x => x >= 0.995 ? '99%+' : x <= 0 ? '0%' : x < 0.005 ? '<1%' : Math.round(x * 100) + '%';

    $('#view-keepers').innerHTML = `
      <div><h2>2027 keepers</h2><p class="lede">Each team's top two keeper options, with the best legal pair marked. Tap a team to see every player it could keep. When the pair isn't simply the two highest values, the reason is under the table. Rosters change, so this moves every week until keepers lock.</p>
        <p class="src"><span><span class="pill fact">Sleeper</span>rosters, picks, keeper costs</span><span><span class="pill est">Estimate</span>2027 draft position and value</span></p></div>
      <label class="field" for="keeper-team">Show<select id="keeper-team">${opts}</select></label>
      <div class="card prose"><ul>
        <li><b>Cost</b> is the 2027 round this team would pay to keep him.</li>
        <li><b>Years</b> is how many seasons he can still be kept, 2027 included.</li>
        <li><b>Projected ADP</b> is where the market has him going in next year's draft, written round.pick for a 12-team draft: 2.03 is the third pick of the second round.</li>
        <li><b>Value</b> is points a week he adds over simply using that pick in the draft. Below zero means the pick is worth more than the player. The word under it is the safer read: Strong is 3 or more, Good is 1 to 3, Marginal is under 1. Next year's draft position is still a guess, so two players a few tenths apart are not really different.</li>
      </ul></div>
      <div class="kgrid">${cards}</div>
      <p class="note">Rule 7? marks a player with no projection left this season. A season-ending injury makes him ineligible. Next year's draft position is an estimate from current market values and will be replaced by real draft rankings in the summer.</p>
      ${pickBoard()}`;
  }

  $('#view-keepers').addEventListener('click', e => {
    const b = e.target.closest('[data-kexp]'); if (!b) return;
    e.preventDefault();
    const r = +b.dataset.kexp; if (keepOpen.has(r)) keepOpen.delete(r); else keepOpen.add(r);
    renderKeepers();
    const f = $(`button[data-kexp="${r}"]`); if (f) f.focus({ preventScroll: true });
  });
  $('#view-keepers').addEventListener('change', e => {
    if (e.target.id !== 'keeper-team') return;
    keepTeam = e.target.value === 'all' ? 'all' : +e.target.value;
    store.set('keeper-team', keepTeam);
    renderKeepers();
    const s = $('#keeper-team'); if (s) s.focus();
  });

  // ---------- how it works
  // ---------- hall of champions
  function renderHall() {
    const H = D.hall, el = $('#view-hall-of-champions');
    if (!H || !H.seasons) { el.innerHTML = '<div><h2>Hall of Champions</h2><p class="lede">League history is not available right now. It will be back with the next update.</p></div>'; return; }
    const champs = new Set(H.seasons.map(x => x.champ.user)).size, n = H.seasons.length;
    const b2b = H.seasons.some((x, i) => i + 1 < n && x.champ.user === H.seasons[i + 1].champ.user);
    const honor = (label, t, extra) => t ? `<div class="honor"><dt>${label}</dt><dd><span class="tn">${esc(t.team)}</span><span class="sub">${esc(t.user)} · ${extra || t.rec}</span></dd></div>` : '';
    const seasons = H.seasons.map(x => `
      <div class="card champ">
        <div class="champ-top"><span class="yr">${x.season}</span>
          <div><span class="pill">Champion</span><span class="champ-name">${esc(x.champ.team)}</span>
          <span class="sub">${esc(x.champ.user)} · ${x.champ.rec} in the regular season</span>
          <span class="sub">Won the two-week final ${x.final[0].toFixed(2)} to ${x.final[1].toFixed(2)}</span></div></div>
        <dl class="honors">
          ${honor('Runner-up', x.runner)}${honor('Third place', x.third)}
          ${honor('Top scorer', x.top_pf, `${x.top_pf.pf.toLocaleString('en-US', { minimumFractionDigits: 1 })} points`)}${honor('Top record', x.top_rec)}
          ${honor('Last place', x.last)}
        </dl>
        <details class="fold"><summary>Final regular-season standings</summary>
          <div class="scroll"><table><thead><tr><th>Team</th><th>Record</th><th>Points</th></tr></thead><tbody>
          ${x.table.map((t, i) => `<tr class="${i === 3 || i === 7 ? 'cut' : ''}"><td><span class="tn">${i + 1}. ${esc(t.team)}</span><span class="sub">${esc(t.user)}</span></td><td>${t.rec}</td><td>${t.pf.toLocaleString('en-US', { minimumFractionDigits: 1 })}</td></tr>`).join('')}
          </tbody></table></div></details>
      </div>`).join('');
    const recs = H.records.map(r => `
      <div class="rbook"><span class="rbook-l">${esc(r.label)}</span><span class="rbook-v">${esc(r.value)}</span>
        <span class="tn">${esc(r.who)}</span><span class="sub">${r.user ? esc(r.user) + ' · ' : ''}${esc(r.when)}</span><span class="sub">${esc(r.detail)}</span></div>`).join('');
    const all = H.alltime.map(o => `<tr><td><span class="tn">${esc(o.user)}</span><span class="sub">${o.seasons} season${o.seasons === 1 ? '' : 's'}</span></td>
      <td>${o.w}–${o.l}${o.t ? '–' + o.t : ''}</td><td>${(100 * (o.w + 0.5 * o.t) / Math.max(o.g, 1)).toFixed(0)}%</td><td>${(o.pf / Math.max(o.g, 1)).toFixed(1)}</td>
      <td>${o.titles || '<span class="dim">0</span>'}</td><td>${o.playoffs || '<span class="dim">0</span>'}</td><td>${o.lasts || '<span class="dim">0</span>'}</td></tr>`).join('');
    el.innerHTML = `
      <div><h2>Hall of Champions</h2><p class="lede">Every season the league has played on Sleeper, ${H.first} to now: ${n} finished season${n === 1 ? '' : 's'}, ${champs} different champion${champs === 1 ? '' : 's'}.${b2b ? '' : ' No one has won back to back in that time, so the dynasty pool is still unclaimed.'}</p></div>
      <div class="champs">${seasons}</div>
      <div><h3>The record book</h3><p class="lede">Regular-season games only, ${H.first} through Week ${H.through} of ${H.season_now}. Team names are the ones in use that season.</p></div>
      <div class="rbooks">${recs}</div>
      <div class="card"><h3>All-time table</h3>
        <div class="scroll"><table class="alltime"><thead><tr><th>Manager</th><th><span class="lg">Record</span><span class="sm">W–L</span></th><th>Win %</th><th>Pts/gm</th><th>Titles</th><th><span class="lg">Playoffs</span><span class="sm">Top 4</span></th><th>Last</th></tr></thead><tbody>${all}</tbody></table></div>
        <p class="note">Regular-season record and points, this season included. Sorted by win percentage. Playoffs (Top 4 on a phone) counts playoff trips, and Last counts last-place finishes.</p></div>
      <p class="note">Last place goes to the loser of the Toilet Bowl: the bottom four play in Week 15, and the two losers meet over Weeks 16 and 17. Seasons before ${H.first} were played on another site and aren't in this data.</p>`;
  }

  function renderHow() {
    const rounds = Array.from({ length: 15 }, (_, i) => i + 1).map(r => `<div><span>${ord(r)}</span><b>${E.roundVal(r).toFixed(1)}</b></div>`).join('');
    const B = E.bands;
    const K = D.card;
    $('#view-how-it-works').innerHTML = `
      <div><h2>How it works</h2><p class="lede">One unit for everything: points a week added to a starting lineup. Short answers first, the full method after.</p></div>
      <div class="card prose"><h3>Short answers</h3>
        <dl class="qa">
          <div><dt>Why is a player worth more to one team than another?</dt><dd>He is worth what he adds to the lineup that team can actually start. An 18-point receiver who replaces a 13-point flex adds 5. On a team where he replaces a 16-point starter he adds 2. That is also why the two sides of a trade rarely add up to the same number.</dd></div>
          <div><dt>How can a draft pick be worth points?</dt><dd>Each round is valued by what players taken in that round of this league's 2026 draft have added to a lineup over a waiver pickup. A pick can also be what pays for a keeper, and then losing it costs more than the round alone.</dd></div>
          <div><dt>Why would a team pay more than it gets?</dt><dd>Points this season and points next season are not the same thing. Points now land in the games that decide this year's title. A pick helps a season nobody can forecast yet. The Trade Analyzer gives no verdict up top. It shows each team's chances this year and next, then three ways to read the trade, so a manager can weigh it for what his own team is going for.</dd></div>
          <div><dt>How accurate are the odds?</dt><dd>Not proven yet. They come from simulating the rest of the season thousands of times from Sleeper's projections, and they have not been checked against how seasons actually finish. The site began saving its odds every day on November 10, 2026 so they can be scored later.</dd></div>
          <div><dt>What is fact and what is estimate?</dt><dd><span class="pill fact">Sleeper</span> Records, scores, rosters, picks and league history come straight from Sleeper. <span class="pill est">Simulation</span> Every percentage is simulated. <span class="pill est">Rebuilt</span> Week-by-week odds before November 10, 2026 were worked out after the fact. <span class="pill est">Estimate</span> Next year's draft positions and keeper values come from today's market values.</dd></div>
        </dl></div>
      <div><h3>The full method</h3></div>
      <div class="card prose"><h3>This season</h3>
        <p>A player is worth what he adds to the best lineup his new team can start, not his raw points. An 18-point receiver who replaces a 13-point flex adds 5. The analyzer builds each team's best lineup for every remaining week from Sleeper's projections, in this league's scoring, before and after the trade. Byes and injuries are in those projections.</p></div>
      <div class="card prose"><h3>Next season: what a 2027 pick is worth</h3>
        <p>Draft order is decided at the Rumble, so a traded pick could land anywhere in its round. Each round gets one value: what players taken in that round of this league's 2026 draft have been worth over a waiver-wire replacement, scaled to starting-lineup points.</p>
        <div class="rounds">${rounds}</div>
        <p>A team that ends up with an extra pick loses its last-round pick, and a team short a pick gets a 16th-rounder, as the rules say.</p></div>
      <div class="card prose"><h3>Next season: what a keeper is worth</h3>
        <p>A keeper is worth the round he would be drafted in minus the round he costs, on the same table. The analyzer finds each team's best legal plan before and after a trade: at most two keepers, at most three assets counting acquired picks, same-round keepers pushed a round earlier, and a missing cost-round pick moving the cost up a round.</p></div>
      <div class="card prose"><h3>Reading a trade</h3>
        <ul>
          <li><b>Before and after.</b> Each team's projected starting lineup, where that ranks among the ${D.teams.length} teams, and its projected final record, with and without the trade. The record is the standings tab's number, rerun with the trade and rounded to whole wins, with the range that holds the middle 80% of simulated seasons. With only a few games left, one trade often leaves the whole-number record where it was. Next season is ranked on picks and keepers alone, because team strength barely carries from one year to the next.</li>
          <li><b>Equal value.</b> Points a week times the games they count for. This season, Weeks ${D.weeks[0]}–${D.reg_end} count in full and the bracket weeks count by the chance the team is playing in one. Next season counts ${B.NEXT_GAMES} regular-season games. When a team buys points now with picks, the analyzer says which pick those points equal. Within 10% either way is equal value; outside that the buyer is paying a premium or getting a discount.</li>
          <li><b>Other trades.</b> Players only or picks only: each team's total points for both seasons are compared. Within ${B.GAP_EVEN} points of each other is even, within ${B.GAP_LEAN} leans, beyond that is lopsided.</li>
          <li><b>The league scale.</b> For trades with a player and a pick, the chart shows the points the buyer gets for every 100 the seller gets, by a rule fixed on Nov 4, 2026 and applied the same way to every league trade since 2024. The middle half of those ${K.n} trades scored ${Math.round(K.band[0])} to ${Math.round(K.band[1])}. It uses points per game so far, because that is the only way past trades can be scored, so it does not see injuries. Its pick values had a 5th above a 4th, so here rounds that are out of order share their average.</li>
          <li><b>Simulated odds.</b> First-place and last-place odds come from ${E.NSIM.toLocaleString('en-US')} simulated finishes, run with today's rosters and again on the same random draws with the trade made. They have not been checked against results, so treat them as rough.</li>
        </ul></div>
      ${D.scen ? `<div class="card prose"><h3>Playoff scenarios</h3>
        <ul>
          <li><b>Most likely path.</b> Take every simulated season where a team ended up in the playoffs, or in the Toilet Bowl. Its path is the record it had most often in those seasons, and the team it most often traded places with. It is the most common route, not the only one, and the table under each team gives the chance at every finish.</li>
          <li><b>Pick the winners.</b> A game you pick comes out that way in every simulated season. Everything you leave alone is still simulated. Ties in record go to points for, so the scores of a picked game are redrawn to fit the result, and a team picked to win as an underdog is treated as a little better than projected in its other games.</li>
          <li><b>In, Out and Safe</b> appear only when the records settle it whatever else happens. Anything short of that stays a percentage.</li>
          <li>These percentages come from the same simulation as the standings, and it has not been checked against results yet. Read them as rough.</li>
        </ul></div>` : ''}
      ${D.hist ? `<div class="card prose"><h3>Home page</h3>
        <ul>
          <li><b>Week-by-week charts.</b> Nothing saved the odds each week, so earlier weeks are rebuilt. Each point reruns the season from that week's real records and rosters. A player counts at his projection for the next game at the time, so an injury that came later isn't known early. The last point is today's number. Read the shape of a line, not the exact value.</li>
          <li><b>This week's biggest game</b> is the game whose result moves the playoff and Toilet Bowl chances the most, added up for the two teams playing it.</li>
        </ul></div>` : ''}
      <div class="card prose"><h3>What it can't see</h3>
        <ul>
          <li>Projections miss. Treat a gap under a point a week as a tie.</li>
          <li>Next year's draft position comes from FantasyCalc's public market values, half redraft and half dynasty. It is an estimate until real 2027 rankings exist.</li>
          <li><b>Keeper rulings.</b> Settled by the commissioner on October 29, 2026: a keeper whose cost-round pick has been traded away costs the next round up, a pick acquired in his cost round can pay for him, and acquired picks count toward the three-asset limit. Still open: what he costs when the next round up is gone too, and whether an acquired pick spent on a keeper counts as an asset on top of the keeper (the site counts it). The analyzer says so when a trade depends on either open question.</li>
          <li>The data refreshes on a schedule, about once an hour and more often while games are on. The time of the last refresh is shown at the top.</li>
        </ul>
        <p class="note">Sources: the Sleeper API for rosters, picks, drafts and projections; FantasyCalc for market values. Team scoring noise of ${D.weekly_sd} points a week is from league history.</p></div>`;
  }

  // ---------- light and dark mode: the device's setting until someone picks one here, then their pick is remembered
  const theme = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
  function setTheme(t, save) {
    document.documentElement.dataset.theme = t;
    if (save) store.set('theme', t);
    const next = t === 'light' ? 'dark' : 'light', b = $('#theme-btn');
    b.setAttribute('aria-label', `Switch to ${next} mode`); b.title = `Switch to ${next} mode`;
    show(location.hash.slice(1));                              // swaps the banner for this mode's version
  }
  $('#theme-btn').addEventListener('click', () => setTheme(theme() === 'light' ? 'dark' : 'light', true));
  try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => { if (!store.get('theme')) setTheme(e.matches ? 'light' : 'dark', false); }); } catch (err) {}

  // ---------- routing
  const VIEWS = ['home', 'standings', 'playoff-scenarios', 'trade-analyzer', 'keepers', 'hall-of-champions', 'rules', 'how-it-works'];
  const HERO = { 'home': 'home', 'standings': 'standings', 'playoff-scenarios': 'war-room', 'trade-analyzer': 'trading-hall', 'keepers': 'keepers', 'hall-of-champions': 'hall' };
  const SHORT_HERO = ['standings', 'playoff-scenarios', 'trade-analyzer', 'keepers'];
  function show(v) {
    let arg = '';
    if (String(v || '').includes('/')) { arg = v.slice(v.indexOf('/') + 1); v = v.slice(0, v.indexOf('/')); }
    if (arg && v === 'playoff-scenarios') { loadSharedPicks(arg); try { history.replaceState(null, '', '#' + v); } catch (err) {} }
    if (arg && v === 'trade-analyzer') { loadSharedTrade(arg); try { history.replaceState(null, '', '#' + v); } catch (err) {} }
    if (v === 'trade-judge') v = 'trade-analyzer';
    if (!VIEWS.includes(v)) v = 'home';
    VIEWS.forEach(x => { $('#view-' + x).classList.toggle('on', x === v); $('#tab-' + x).setAttribute('aria-selected', String(x === v)); });
    $('#nav-select').value = v;
    // the banner for this section, with the section's own heading set over its dark side
    const art = HERO[v], hero = $('#hero'), own = $('#view-' + v + ' h2');
    VIEWS.forEach(x => $('#view-' + x).classList.toggle('has-hero', !!HERO[x]));
    hero.hidden = !art; hero.classList.toggle('short', SHORT_HERO.includes(v)); hero.dataset.art = art || '';
    if (art) { hero.style.backgroundImage = `url(assets/banner-${art}${theme() === 'light' ? '-light' : ''}.webp)`; $('#hero-title').textContent = own ? own.textContent : ''; }
    if (v === 'home') drawCharts();                           // the charts size themselves to the page, so draw once it is showing
  }
  const go = v => { show(v); try { location.hash = v; } catch (err) {} try { window.scrollTo(0, 0); } catch (err) {} };
  $('nav.tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) go(b.dataset.view); });
  // a magic or shitty number opens that team's card on the scenarios page (and doesn't fold the standings row open)
  $('#view-standings').addEventListener('click', e => {
    const a = e.target.closest('a[data-scen-team]'); if (!a) return;
    e.preventDefault();
    scenTeam = +a.dataset.scenTeam; scenView = 'paths'; store.set('scen-team', scenTeam); store.set('scen-view', scenView);
    renderScen(); go('playoff-scenarios');
  });
  $('#nav-select').addEventListener('change', e => go(e.target.value));
  $('#rules-lineup').textContent = `Starters: ${['QB', 'RB', 'WR', 'TE'].map(p => `${D.slots[p]} ${p}`).join(', ')}, ${D.n_flex} FLEX (RB/WR/TE), ${D.slots.DEF} DEF. Rosters hold ${D.roster_max} players, and the draft is 15 rounds.`;
  // rules: a jump list built from the section headings
  (function () {
    const heads = [...document.querySelectorAll('#view-rules .rulebook')];
    $('#rules-toc').innerHTML = heads.map((c, i) => `<button type="button" class="btn quiet" data-jump="${i}">${esc(c.querySelector('h3').textContent.replace(' appendix', ''))}</button>`).join('');
    $('#rules-toc').addEventListener('click', e => { const b = e.target.closest('[data-jump]'); if (!b) return; try { heads[+b.dataset.jump].scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (err) {} });
  })();
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  renderHome(); renderStandings(); renderScen(); renderTrade(); renderKeepers(); renderHall(); renderHow();
  setTheme(theme(), false);
})();
</script>
</body>
</html>
